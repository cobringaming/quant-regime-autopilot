name: QuantRegime Daily Autopilot

on:
  schedule:
    # 1. Pre-Market Scan: 13:45 UTC (8:45 AM EST) Monday-Friday
    - cron: '45 13 * * 1-5'
    # 2. Pre-Close 3:55 PM Rule & Box Breakout Scan: 20:40 UTC (3:40 PM EST) Monday-Friday
    - cron: '40 20 * * 1-5'
  workflow_dispatch: # Lets you trigger a run anytime from your phone's GitHub app

permissions:
  contents: write # Allows GitHub Actions to auto-save the latest daily_quant_scan.json

jobs:
  run-quant-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance google-genai pandas numpy requests

      - name: Execute Quant Equations, News Scraper, AI Reasoning & Mobile Push
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python daily_quant_engine.py

      - name: Auto-Publish Latest JSON Scan for AI Studio App
        run: |
          git config --global user.name "QuantAutopilotBot"
          git config --global user.email "bot@noreply.github.com"
          git add daily_quant_scan.json market_fundamentals.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily_quant_scan.json" && git push)
